<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Math AZ — прототип «к концу года»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">A</span> AI Math AZ <span class="muted">· прототип «к концу года»</span></div>
  <select class="demo" data-change="demo" aria-label="Показать функцию">
    <option value="">▶ Показать функцию…</option>
    <option value="hint">ИИ-подсказка учителю (фронтальная работа)</option>
    <option value="helper">ИИ-помощник ученику</option>
    <option value="bonus">Бонусные задания</option>
    <option value="hw">Персональная домашка</option>
    <option value="map">Карта знаний и дорешивание</option>
    <option value="skills">Навыки каждого ученика</option>
    <option value="review">ИИ-предпроверка фото</option>
    <option value="audio">ИИ-аудиокоуч</option>
  </select>
  <div class="legend"><span class="new">✦ новое</span> — функции, которые появятся к концу года</div>
  <button class="ghost" data-action="reset">Сбросить</button>
</header>
<main id="stage" class="stage">
  <section id="teacher" class="teacher"></section>
  <section id="studentWrap" class="student-wrap"></section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
